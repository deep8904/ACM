sources:
  - id: openai-news
    name: OpenAI News
    type: rss
    url: https://openai.com/news/rss.xml
    authority: primary
    topics: [ai, software, models]
    enabled: true
    maxItems: 20
    timeoutMs: 10000
    language: en

  - id: figma-release-notes
    name: Figma Release Notes
    type: atom
    url: https://www.figma.com/release-notes/feed/atom.xml
    authority: primary
    topics: [design, ai, creator-technology]
    enabled: true
    maxItems: 20
    timeoutMs: 10000
    language: en

  - id: unity-lts-releases
    name: Unity LTS Releases
    type: atom
    url: https://unity.com/releases/editor/lts-releases.xml
    authority: primary
    topics: [gaming, game-development, game-engine]
    enabled: true
    maxItems: 20
    timeoutMs: 10000
    language: en

  - id: nintendo-news
    name: Nintendo News
    type: rss
    url: https://www.nintendo.co.jp/news/whatsnew.xml
    authority: primary
    topics: [gaming, nintendo, hardware]
    enabled: true
    maxItems: 20
    timeoutMs: 10000
    language: ja

  - id: verge-technology
    name: The Verge Technology
    type: rss
    url: https://www.theverge.com/rss/index.xml
    authority: independent
    topics: [hardware, monitors, computers, software, gaming]
    enabled: true
    maxItems: 20
    timeoutMs: 10000
    language: en

  - id: github-changelog
    name: GitHub Changelog
    type: rss
    url: https://github.blog/changelog/feed/
    authority: primary
    topics: [software, developer-tools]
    enabled: true
    maxItems: 20
    timeoutMs: 10000
    language: en

  - id: mozilla-hacks
    name: Mozilla Hacks
    type: rss
    url: https://hacks.mozilla.org/feed/
    authority: primary
    topics: [software, web]
    enabled: true
    maxItems: 20
    timeoutMs: 10000
    language: en

  - id: hacker-news
    name: Hacker News
    type: hacker-news
    url: https://hacker-news.firebaseio.com/v0
    authority: community
    topics: [software, ai, computing]
    enabled: true
    maxItems: 20
    timeoutMs: 8000
    language: en
    mode: top

  # Disabled placeholders are intentionally non-production until their URLs are verified.
  - id: future-ai-official
    name: Future verified AI source
    type: rss
    url: https://example.com/ai-feed.xml
    authority: primary
    topics: [ai]
    enabled: false

  - id: future-design-official
    name: Future verified design source
    type: atom
    url: https://example.com/design-feed.xml
    authority: primary
    topics: [design]
    enabled: false

  - id: future-gaming-official
    name: Future verified gaming source
    type: rss
    url: https://example.com/gaming-feed.xml
    authority: primary
    topics: [gaming, game-development]
    enabled: false
