name: Content automation worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      migration_only:
        description: "Apply additive migrations without reconciling or draining automation jobs"
        required: false
        default: false
        type: boolean
      audit_event_ids:
        description: "Optional comma-separated approved-event IDs for a redacted read-only audit"
        required: false
        type: string
      audit_job_ids:
        description: "Optional comma-separated automation-job IDs for a redacted read-only audit"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One durable worker at a time. A later invocation waits instead of racing
  # the active lease owner or cancelling work mid-stage.
  group: ai-content-machine-production-worker
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      NODE_ENV: production
      STORAGE_BACKEND: postgres
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
      DATABASE_SCHEMA: content_machine
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
      TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      TELEGRAM_CALLBACK_SECRET: ${{ secrets.TELEGRAM_CALLBACK_SECRET }}
      BLOG_GITHUB_TOKEN: ${{ secrets.BLOG_GITHUB_TOKEN }}
      BLOG_REPOSITORY: deep8904/Deep-Blog
      BLOG_DEFAULT_BRANCH: main
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      PUBLICATION_CONFIG: automation/config/publication.production.yaml
      VERCEL_DEPLOYMENT_METADATA_SOURCE: github
      CONTROL_PLANE_ORIGIN: ${{ vars.CONTROL_PLANE_ORIGIN }}
      PREVIEW_SIGNING_SECRET: ${{ secrets.PREVIEW_SIGNING_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      LLM_PROVIDER: gemini
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      GOOGLE_AI_MODEL: ${{ vars.GOOGLE_AI_MODEL || 'gemini-3.6-flash' }}
      AUTOMATION_MAX_JOBS_PER_RUN: "4"
      AUTOMATION_LEASE_MINUTES: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Apply additive database migrations
        run: npm run db:migrate
      - name: Audit requested research lineage
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_only != true && (inputs.audit_event_ids != '' || inputs.audit_job_ids != '') }}
        env:
          AUDIT_EVENT_IDS: ${{ inputs.audit_event_ids }}
          AUDIT_JOB_IDS: ${{ inputs.audit_job_ids }}
        run: npm run automation:audit
      - name: Reconcile and drain durable work
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.migration_only != true }}
        run: npm run automation:worker
